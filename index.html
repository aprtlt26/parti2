<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>aprtlt®art&psych 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgb(12, 60, 252);
            cursor: none; 
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <script>
        let inc = 0.02;
        let scl = 20;
        let cols, rows;
        let zoff = 0;
        let particles = [];
        let flowfield;
        let maxSpeed = 2.5;
        let audioStarted = false;
        let globalReverb;
        let combFilter;
        let cursorRadius = 30;
        let lastFrequencyReset = 0;
        let frequencyResetInterval = 30000;
        let frequencyTransitionDuration = 10000;
        let frequencyTransitionStart = 0;
        let transitioningFrequencies = false;

        let masterVolume = 0.8;
        let isMuted = false;

        let audioCtx = null;
        let masterGainNode = null;
        let listenerRotX = 0;
        let listenerRotY = 0;

        function initSpatialAudio() {
            try {
                audioCtx = getAudioContext();
                if (!audioCtx) return;
                
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = 0.8;
                masterGainNode.connect(audioCtx.destination);
                
                if (audioCtx.listener) {
                    audioCtx.listener.positionX.value = 0;
                    audioCtx.listener.positionY.value = 0;
                    audioCtx.listener.positionZ.value = 0;
                    audioCtx.listener.forwardX.value = 0;
                    audioCtx.listener.forwardY.value = 0;
                    audioCtx.listener.forwardZ.value = -1;
                    audioCtx.listener.upX.value = 0;
                    audioCtx.listener.upY.value = 1;
                    audioCtx.listener.upZ.value = 0;
                }
            } catch(e) {
                console.warn('Error al iniciar audio 3D:', e);
            }
        }

        function updateListenerOrientation(mx, my) {
            if (!audioCtx || !audioCtx.listener) return;
            
            let targetRotY = map(mx, 0, width, -0.8, 0.8);
            let targetRotX = map(my, 0, height, 0.2, -0.2);
            listenerRotX += (targetRotX - listenerRotX) * 0.03;
            listenerRotY += (targetRotY - listenerRotY) * 0.03;
            
            try {
                let fwdX = -Math.sin(listenerRotY);
                let fwdZ = -Math.cos(listenerRotY);
                let fwdY = Math.sin(listenerRotX) * 0.1;
                let fwdLen = Math.sqrt(fwdX*fwdX + fwdY*fwdY + fwdZ*fwdZ);
                if (fwdLen > 0) { fwdX /= fwdLen; fwdY /= fwdLen; fwdZ /= fwdLen; }
                
                let upX = Math.sin(listenerRotX) * 0.15;
                let upY = 0.9;
                let upZ = 0;
                
                audioCtx.listener.forwardX.value = fwdX;
                audioCtx.listener.forwardY.value = fwdY;
                audioCtx.listener.forwardZ.value = fwdZ;
                audioCtx.listener.upX.value = upX;
                audioCtx.listener.upY.value = upY;
                audioCtx.listener.upZ.value = upZ;
            } catch(e) {}
        }

        function connectOscillatorToPanner(osc, index) {
            if (!audioCtx) return;
            
            let panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.refDistance = 1.5;
            panner.maxDistance = 50;
            panner.rolloffFactor = 0.8;
            panner.coneInnerAngle = 360;
            panner.coneOuterAngle = 0;
            panner.coneOuterGain = 0;
            

            let angle = (index / 350) * TWO_PI * 3;
            let radius = 3 + random(0, 6);
            panner.positionX.value = Math.cos(angle) * radius * 0.5;
            panner.positionY.value = Math.sin(angle * 0.7) * 3;
            panner.positionZ.value = Math.sin(angle) * radius * 0.3 + 10;
            
            if (masterGainNode) {
                panner.connect(masterGainNode);
            } else {
                panner.connect(audioCtx.destination);
            }
            
            try {
                if (osc._gainNode) {
                    osc._gainNode.disconnect();
                    osc._gainNode.connect(panner);
                } else {
                    osc.disconnect();
                    osc.connect(panner);
                }
            } catch(e) {
                try {
                    osc.disconnect();
                    osc.connect(panner);
                } catch(e2) {}
            }
            
            return panner;
        }

        function updatePannerPosition(panner, x, y, z) {
            if (!panner) return;
            try {
                panner.positionX.value = x;
                panner.positionY.value = y;
                panner.positionZ.value = z;
            } catch(e) {
                try { panner.setPosition(x, y, z); } catch(e2) {}
            }
        }


        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent(document.body);

            pixelDensity(displayDensity());

            cols = floor(width / scl);
            rows = floor(height / scl);
            flowfield = new Array(cols * rows);

            initSpatialAudio();

            globalReverb = new p5.Reverb();
            globalReverb.set(1, 6);

            combFilter = new p5.Delay();
            combFilter.setType('delay');
            combFilter.delayTime(0.12);
            combFilter.feedback(0.15);
            combFilter.amp(0.1);

            for (let i = 0; i < 350; i++) {
                particles[i] = new Particle(i);
            }

            background(12, 60, 252);
            noLoop();
            
            initUI();
        }

     
        function draw() {
            if (!audioStarted) return;

            updateListenerOrientation(mouseX, mouseY);

            background(12, 60, 252);

            let yoff = 0;
            for (let y = 0; y < rows; y++) {
                let xoff = 0;
                for (let x = 0; x < cols; x++) {
                    let index = x + y * cols;
                    let angle = noise(xoff, yoff, zoff) * TWO_PI;
                    let v = p5.Vector.fromAngle(angle);
                    v.setMag(0.1);
                    flowfield[index] = v;
                    xoff += inc;
                }
                yoff += inc;
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].follow(flowfield);
                particles[i].interactWithCursor(mouseX, mouseY);
                particles[i].update();
                particles[i].edges();
                particles[i].show();
            }

            zoff += 0.001;

            fill(255, 255, 255, 30);
            noStroke();
            ellipse(mouseX, mouseY, cursorRadius * 2, cursorRadius * 2);
            fill(255, 255, 255, 80);
            ellipse(mouseX, mouseY, cursorRadius * 0.5, cursorRadius * 0.5);

            if (millis() - lastFrequencyReset > frequencyResetInterval && !transitioningFrequencies) {
                initiateFrequencyTransition();
                lastFrequencyReset = millis();
            }

            if (transitioningFrequencies) {
                updateFrequenciesTransition();
            }
        }


        function touchStarted() {
            if (!audioStarted) {
                startAudio();
            } else {
                initiateFrequencyTransition();
            }
            return false;
        }

        function mousePressed() {
            if (!audioStarted) {
                startAudio();
            } else {
                initiateFrequencyTransition();
            }
        }

        function startAudio() {
            if (!audioStarted) {
                userStartAudio().then(() => {
                    audioStarted = true;
                    if (audioCtx && audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    loop();
                }).catch((err) => {
                    console.log('Error al iniciar el audio: ', err);
                });
            }
        }


        function initiateFrequencyTransition() {
            let newFrequencies = generateHarmoniousFrequencies();
            for (let i = 0; i < particles.length; i++) {
                particles[i].startFrequencyTransition(newFrequencies[floor(random(newFrequencies.length))]);
            }
            frequencyTransitionStart = millis();
            transitioningFrequencies = true;
        }

        function updateFrequenciesTransition() {
            let elapsedTime = millis() - frequencyTransitionStart;
            let t = elapsedTime / frequencyTransitionDuration;
            if (t >= 1) {
                t = 1;
                transitioningFrequencies = false;
            }
            for (let i = 0; i < particles.length; i++) {
                particles[i].updateFrequency(t);
            }
        }

        function generateHarmoniousFrequencies() {
            let frequencies = [];
            let baseFreq = random(100, 400);
            for (let i = 1; i <= 8; i++) {
                let harmonicFreq = baseFreq * (Math.pow(2, i / random(8, 16)));
                frequencies.push(harmonicFreq);
            }
            return frequencies;
        }

    
        class Particle {
            constructor(id) {
                this.id = id;
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = maxSpeed;
                this.prevPos = this.pos.copy();

                this.depthZ = random(2, 18);
                this.targetDepthZ = this.depthZ;

                this.baseFreq = random(100, 600);
                this.targetFreq = this.baseFreq;
                this.startFreq = this.baseFreq;

                this.oscillator = new p5.Oscillator('sine');
                this.oscillator.freq(this.baseFreq);
                this.oscillator.amp(0);

                this.oscillator.disconnect();
                this.oscillator.connect(globalReverb);
                this.oscillator.connect(combFilter);

                this.panner = connectOscillatorToPanner(this.oscillator, id);

                let angle3d = (id / 350) * TWO_PI * 3;
                let radius3d = 3 + random(0, 5);
                this.x3d = Math.cos(angle3d) * radius3d * 0.5;
                this.y3d = Math.sin(angle3d * 0.7) * 3;
                this.z3d = Math.sin(angle3d) * radius3d * 0.3 + 10;
                this.targetX3d = this.x3d;
                this.targetY3d = this.y3d;
                this.targetZ3d = this.z3d;

                if (this.panner) {
                    updatePannerPosition(this.panner, this.x3d, this.y3d, this.z3d);
                }

                this.shouldPlaySound = random(1) < 0.15;
                this.soundDuration = random(5000, 15000);
                this.nextSoundTime = millis() + random(3000, 10000);
                this.isPlaying = false;
                this.isColliding = false;
            }

            follow(vectors) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let index = x + y * cols;
                let force = vectors[index];
                if (force) this.applyForce(force);
            }

            applyForce(force) {
                this.acc.add(force);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                this.targetX3d = map(this.pos.x, 0, width, -8, 8);
                this.targetY3d = map(this.pos.y, 0, height, 6, -6);
                
                let zWave = sin(this.pos.y * 0.015 + this.id * 0.1) * 3;
                this.targetZ3d = map(this.pos.y, 0, height, 16, 3) + zWave;
                this.depthZ = this.targetZ3d;

                this.x3d += (this.targetX3d - this.x3d) * 0.05;
                this.y3d += (this.targetY3d - this.y3d) * 0.05;
                this.z3d += (this.targetZ3d - this.z3d) * 0.05;

                if (this.panner) {
                    updatePannerPosition(this.panner, this.x3d, this.y3d, this.z3d);
                }

                let currentTime = millis();
                if (this.shouldPlaySound && currentTime >= this.nextSoundTime) {
                    if (!this.isPlaying) {
                        this.oscillator.start();
                        this.oscillator.amp(0.05 * masterVolume, 0.5);
                        this.isPlaying = true;

                        setTimeout(() => {
                            this.oscillator.amp(0, 1);
                            setTimeout(() => {
                                this.oscillator.stop();
                                this.isPlaying = false;
                            }, 1000);
                        }, this.soundDuration - 1000);
                    }
                    this.nextSoundTime = currentTime + random(3000, 10000);
                }
            }

            startFrequencyTransition(newFreq) {
                this.startFreq = this.baseFreq;
                this.targetFreq = newFreq;
            }

            updateFrequency(t) {
                let easedT = t * t * (3 - 2 * t);
                this.baseFreq = lerp(this.startFreq, this.targetFreq, easedT);
                if (!this.isColliding) {
                    this.oscillator.freq(this.baseFreq);
                }
            }

            interactWithCursor(mx, my) {
                let mousePos = createVector(mx, my);
                let distanceToMouse = dist(this.pos.x, this.pos.y, mousePos.x, mousePos.y);

                if (distanceToMouse < cursorRadius) {
                    this.isColliding = true;

                    let collisionVector = p5.Vector.sub(this.pos, mousePos);
                    collisionVector.setMag(6);
                    this.applyForce(collisionVector);

                    let modulation = noise(this.pos.x * 0.05, this.pos.y * 0.05, zoff * 5) * 800;
                    let newFreq = this.baseFreq + modulation;
                    newFreq = constrain(newFreq, 100, 2000);
                    this.oscillator.freq(newFreq);

                    if (!this.isPlaying) {
                        this.oscillator.start();
                        this.isPlaying = true;
                        this.oscillator.amp(0.12 * masterVolume, 0.05);
                    }

                    let distFactor = 1 - (distanceToMouse / cursorRadius);
                    let pushZ = distFactor * 8;
                    if (this.panner) {
                        let newZ = this.z3d + pushZ * 0.8;
                        updatePannerPosition(this.panner, this.x3d, this.y3d, Math.min(22, newZ));
                    }

                    combFilter.delayTime(0.02);
                    combFilter.feedback(0.5);
                } else {
                    this.isColliding = false;
                    this.oscillator.freq(this.baseFreq);

                    if (this.panner) {
                        updatePannerPosition(this.panner, this.x3d, this.y3d, this.z3d);
                    }

                    combFilter.delayTime(0.12);
                    combFilter.feedback(0.15);

                    if (!this.shouldPlaySound && this.isPlaying) {
                        this.oscillator.amp(0, 0.5);
                        setTimeout(() => {
                            this.oscillator.stop();
                            this.isPlaying = false;
                        }, 500);
                    }
                }
            }

            show() {
                let brightness = map(this.z3d, 2, 20, 150, 255);
                let alpha = map(this.z3d, 2, 20, 100, 220);
                
                stroke(255, 255, 255, brightness * 0.6);
                strokeWeight(1.5);
                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                this.prevPos = this.pos.copy();

                let size = map(this.z3d, 2, 20, 1.5, 5);
                noStroke();
                fill(255, 255, 255, alpha);
                ellipse(this.pos.x, this.pos.y, size, size);
                
                fill(255, 255, 255, alpha * 0.3);
                ellipse(this.pos.x, this.pos.y, size * 2.5, size * 2.5);
            }

            edges() {
                if (this.pos.x > width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = width;
                if (this.pos.y > height) this.pos.y = 0;
                if (this.pos.y < 0) this.pos.y = height;
                this.prevPos = this.pos.copy();
            }

            reset() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.prevPos = this.pos.copy();
                this.shouldPlaySound = random(1) < 0.15;
                this.soundDuration = random(5000, 15000);
                this.nextSoundTime = millis() + random(3000, 10000);
                this.startFreq = this.baseFreq;
                this.targetFreq = this.baseFreq;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            cols = floor(width / scl);
            rows = floor(height / scl);
            flowfield = new Array(cols * rows);
        }

                #binauralOverlay .binaural-modal .features {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 8px;
                    margin: 16px 0 20px;
                }
                #binauralOverlay .binaural-modal .features span {
                    background: rgba(255, 255, 255, 0.06);
                    padding: 4px 14px;
                    border-radius: 20px;
                    font-size: 10px;
                    color: rgba(255, 255, 255, 0.6);
                    letter-spacing: 1px;
                    border: 1px solid rgba(255, 255, 255, 0.05);
                }
                #binauralOverlay .binaural-modal .close-btn {
                    background: rgba(255, 255, 255, 0.06);
                    border: 1px solid rgba(255, 255, 255, 0.15);
                    color: rgba(255, 255, 255, 0.8);
                    padding: 10px 30px;
                    border-radius: 30px;
                    cursor: pointer;
                    font-family: inherit;
                    font-size: 11px;
                    letter-spacing: 1.5px;
                    transition: all 0.3s ease;
                    margin-top: 8px;
                }
                #binauralOverlay .binaural-modal .close-btn:hover {
                    background: rgba(255, 255, 255, 0.12);
                    border-color: rgba(255, 255, 255, 0.3);
                }

                @media (max-width: 768px) {
                    #telesmaInfo {
                        top: 10px;
                        left: 10px;
                        padding: 6px 10px;
                        max-width: 160px;
                    }
                    #telesmaInfo .telesma-title { font-size: 8px; }
                    #telesmaInfo .telesma-body p { font-size: 7px; }
                    #telesmaInfo .telesma-author { font-size: 6.5px; }
                    #binauralBtn {
                        top: 10px;
                        right: 10px;
                        width: 30px;
                        height: 30px;
                        font-size: 13px;
                    }
                    #audioUI { bottom: 15px; right: 15px; padding: 6px 8px; }
                    #masterSlider { width: 80px; }
                    #binauralOverlay .binaural-modal { padding: 30px 24px; }
                    #binauralOverlay .binaural-modal h2 { font-size: 15px; }
                    #binauralOverlay .binaural-modal p { font-size: 12px; }
                }
            `;
            document.head.appendChild(style);

            const slider = document.getElementById('masterSlider');
            const muteBtn = document.getElementById('muteBtn');
            const binauralBtnEl = document.getElementById('binauralBtn');
            const closeTelesma = document.getElementById('closeTelesma');
            const telesmaDivEl = document.getElementById('telesmaInfo');

            slider.addEventListener('input', e => {
                masterVolume = parseFloat(e.target.value);
                if (masterGainNode) {
                    masterGainNode.gain.value = masterVolume * 0.8;
                }
            });

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) {
                    muteBtn.innerHTML = 'X';
                    if (masterGainNode) masterGainNode.gain.value = 0;
                    for (let p of particles) {
                        p.oscillator.amp(0, 0.05);
                    }
                } else {
                    muteBtn.innerHTML = 'M';
                    if (masterGainNode) masterGainNode.gain.value = masterVolume * 0.8;
                }
            });

            binauralBtnEl.addEventListener('click', () => {
                overlay.classList.add('active');
            });

            closeTelesma.addEventListener('click', (e) => {
                e.stopPropagation();
                telesmaDivEl.style.opacity = '0';
                telesmaDivEl.style.transform = 'translateX(-20px)';
                setTimeout(() => {
                    telesmaDivEl.style.display = 'none';
                }, 300);
            });

            document.getElementById('closeBinaural').addEventListener('click', () => {
                overlay.classList.remove('active');
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('active');
            });
        }
    </script>
</body>
</html>
