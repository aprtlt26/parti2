<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telesma | Relieve + Audio 3D HRTF</title>
    <style>
        body { margin: 0; overflow: hidden; background: #7a8490; cursor: default; }
        canvas { display: block; width: 100%; height: 100%; }
        #info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.3); font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px;
            pointer-events: none; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        #startHint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-family: monospace; font-size: 14px;
            background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1); pointer-events: none; z-index: 20;
            transition: opacity 0.5s ease;
        }
        #telesmaInfo {
            position: fixed; top: 16px; left: 16px; z-index: 999999;
            background: rgba(10, 10, 15, 0.55); backdrop-filter: blur(12px);
            border-radius: 12px; padding: 8px 14px; max-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: 'SF Mono', 'JetBrains Mono', monospace; cursor: pointer;
        }
        #telesmaInfo:hover { background: rgba(10, 10, 15, 0.75); border-color: rgba(255, 255, 255, 0.3); }
        .telesma-header { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
        .telesma-symbol { font-size: 9px; color: rgba(200, 220, 100, 0.9); }
        .telesma-title { font-size: 9px; letter-spacing: 1.5px; color: rgba(200, 220, 100, 0.9); text-transform: uppercase; font-weight: 500; }
        .telesma-body p { font-size: 8.5px; line-height: 1.3; color: rgba(255, 255, 255, 0.7); margin-bottom: 2px; }
        .telesma-author { font-size: 7.5px; color: rgba(255, 255, 255, 0.4); margin-top: 2px; padding-top: 2px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
        .telesma-close { position: absolute; top: 4px; right: 8px; color: rgba(255, 255, 255, 0.25); font-size: 10px; cursor: pointer; }
        .telesma-close:hover { color: rgba(255, 255, 255, 0.7); }
        #audioUI { position: fixed; bottom: 20px; right: 20px; z-index: 999998; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); padding: 8px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        #masterSlider { width: 120px; height: 2px; appearance: none; background: #aaa; outline: none; }
        #masterSlider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }
        #muteBtn { width: 22px; height: 22px; border: none; border-radius: 50%; background: #111; color: white; font-size: 10px; cursor: pointer; }
        #binauralBtn { position: fixed; top: 16px; right: 16px; z-index: 999999; width: 36px; height: 36px; border: none; border-radius: 50%; background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(8px); color: rgba(255, 255, 255, 0.8); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.1); }
        #binauralBtn:hover { background: rgba(10, 10, 15, 0.95); transform: scale(1.05); }
        #binauralOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #binauralOverlay.active { opacity: 1; pointer-events: all; }
        .binaural-modal { background: rgba(15,15,20,0.9); backdrop-filter: blur(20px); border-radius: 24px; padding: 40px 50px; max-width: 480px; width: 90%; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 80px rgba(0,0,0,0.8); font-family: 'SF Mono','JetBrains Mono',monospace; text-align: center; transform: scale(0.95); transition: transform 0.4s ease; color: white; }
        #binauralOverlay.active .binaural-modal { transform: scale(1); }
        .binaural-modal h2 { font-size: 18px; letter-spacing: 2px; color: rgba(200,220,100,0.9); text-transform: uppercase; margin-bottom: 12px; }
        .binaural-modal p { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
        .binaural-modal .close-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); padding: 10px 30px; border-radius: 30px; cursor: pointer; font-size: 11px; letter-spacing: 1.5px; margin-top: 8px; }
        .binaural-modal .close-btn:hover { background: rgba(255,255,255,0.12); }
        @media (max-width: 768px) { #telesmaInfo { top: 10px; left: 10px; padding: 6px 10px; max-width: 160px; } #binauralBtn { top: 10px; right: 10px; width: 30px; height: 30px; font-size: 13px; } #audioUI { bottom: 15px; right: 15px; padding: 6px 8px; } #masterSlider { width: 80px; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
</head>
<body>
    <div id="info">Crecimiento por Surcos | Audio 3D HRTF</div>
    <div id="startHint">🎧 Toca para activar el sonido 3D</div>
    
    <div id="telesmaInfo">
        <span class="telesma-close" id="closeTelesma">✕</span>
        <div class="telesma-header">
            <span class="telesma-symbol">◈</span>
            <span class="telesma-title">TELESMA 2</span>
        </div>
        <div class="telesma-body">
            <p>Dispositivo táctil de interacción terapéutica basado en flujos sonoros y campos vectoriales.</p>
            <p class="telesma-author">Alfonso Pretelt</p>
        </div>
    </div>
    <button id="binauralBtn">🎧</button>
    <div id="audioUI">
        <button id="muteBtn">M</button>
        <input type="range" id="masterSlider" min="0" max="2" step="0.01" value="0.9">
    </div>
    <div id="binauralOverlay">
        <div class="binaural-modal">
            <h2>◈ escucha binaural 3D</h2>
            <p>Sistema HRTF (Head-Related Transfer Function).</p>
            <button class="close-btn" id="closeBinaural">⟡ entender</button>
        </div>
    </div>

    <script>
        // ============================================================
        // PARTE 1: AUDIO 3D HRTF
        // ============================================================
        let audioStarted = false;
        let audioCtx = null;
        let masterGainNode = null;
        let dryGainNode = null;
        let reverbGainNode = null;
        let listenerRotX = 0, listenerRotY = 0;
        let targetRotX = 0, targetRotY = 0;
        let masterVolume = 0.9;
        let isMuted = false;
        let voicePool = [];
        let voiceIndex = 0;
        const VOICES = 24;

        function initSpatialAudio() {
            try {
                audioCtx = getAudioContext();
                if (!audioCtx) return;
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = 0.7;
                masterGainNode.connect(audioCtx.destination);
                dryGainNode = audioCtx.createGain();
                dryGainNode.gain.value = 1.0;
                dryGainNode.connect(masterGainNode);
                reverbGainNode = audioCtx.createGain();
                reverbGainNode.gain.value = 0.3;
                reverbGainNode.connect(masterGainNode);
                if (audioCtx.listener) {
                    audioCtx.listener.positionX.value = 0;
                    audioCtx.listener.positionY.value = 0;
                    audioCtx.listener.positionZ.value = 0;
                    audioCtx.listener.forwardX.value = 0;
                    audioCtx.listener.forwardY.value = 0;
                    audioCtx.listener.forwardZ.value = -1;
                    audioCtx.listener.upX.value = 0;
                    audioCtx.listener.upY.value = 1;
                    audioCtx.listener.upZ.value = 0;
                }
            } catch(e) { console.warn('Error de audio:', e); }
        }

        function updateListenerOrientation(mx, my) {
            if (!audioCtx || !audioCtx.listener) return;
            targetRotY = map(mx, 0, width, -1.2, 1.2);
            targetRotX = map(my, 0, height, 0.3, -0.3);
            listenerRotX += (targetRotX - listenerRotX) * 0.05;
            listenerRotY += (targetRotY - listenerRotY) * 0.05;
            try {
                let fwdX = -Math.sin(listenerRotY);
                let fwdZ = -Math.cos(listenerRotY);
                let fwdY = Math.sin(listenerRotX) * 0.1;
                let fwdLen = Math.sqrt(fwdX*fwdX + fwdY*fwdY + fwdZ*fwdZ);
                if (fwdLen > 0) { fwdX /= fwdLen; fwdY /= fwdLen; fwdZ /= fwdLen; }
                let upX = Math.sin(listenerRotX) * 0.15;
                let upY = 0.9;
                let upZ = 0;
                audioCtx.listener.forwardX.value = fwdX;
                audioCtx.listener.forwardY.value = fwdY;
                audioCtx.listener.forwardZ.value = fwdZ;
                audioCtx.listener.upX.value = upX;
                audioCtx.listener.upY.value = upY;
                audioCtx.listener.upZ.value = upZ;
            } catch(e) {}
        }

        class VoicePanner {
            constructor() {
                if (!audioCtx) return;
                this.pannerNode = audioCtx.createPanner();
                this.pannerNode.panningModel = 'HRTF';
                this.pannerNode.distanceModel = 'inverse';
                this.pannerNode.refDistance = 1.0;
                this.pannerNode.maxDistance = 100;
                this.pannerNode.rolloffFactor = 1.0;
                if (dryGainNode) this.pannerNode.connect(dryGainNode);
                if (reverbGainNode) this.pannerNode.connect(reverbGainNode);
                this.posX = 0; this.posY = 0; this.posZ = 0;
            }
            setPosition(x, y, z) {
                this.posX = x; this.posY = y; this.posZ = z;
                try {
                    this.pannerNode.positionX.value = x;
                    this.pannerNode.positionY.value = y;
                    this.pannerNode.positionZ.value = z;
                } catch(e) {}
            }
            connectOscillator(osc) {
                try {
                    if (osc._gainNode) {
                        osc._gainNode.disconnect();
                        osc._gainNode.connect(this.pannerNode);
                    } else {
                        osc.disconnect();
                        osc.connect(this.pannerNode);
                    }
                } catch(e) { try { osc.disconnect(); osc.connect(this.pannerNode); } catch(e2) {} }
            }
        }

        function initVoicePool() {
            for(let i=0; i<VOICES; i++){
                let osc = new p5.Oscillator('sine');
                osc.amp(0);
                let panner = new VoicePanner();
                panner.connectOscillator(osc);
                osc.start();
                voicePool.push({ osc: osc, panner: panner });
            }
        }

        function playSoundFromBranch(x, y, depth, freq, amp) {
            if (isMuted || masterVolume === 0) return;
            let voice = voicePool[voiceIndex];
            voiceIndex = (voiceIndex + 1) % VOICES;
            if (!voice) return;

            let x3d = map(x, 0, width, -10, 10);
            let y3d = map(y, 0, height, 7, -7);
            let z3d = depth * 2;
            voice.panner.setPosition(x3d, y3d, z3d);

            voice.osc.freq(freq);
            voice.osc.amp(amp * masterVolume, 0.02);

            setTimeout(() => {
                voice.osc.amp(0, 0.08);
            }, random(80, 250));
        }

        // ============================================================
        // PARTE 2: CRECIMIENTO ORGÁNICO (Formas No Circulares)
        // ============================================================
        class Branch {
            constructor(x, y, angle, parent = null) {
                this.x = x; this.y = y; 
                this.angle = angle; 
                this.parent = parent;
                
                this.thickness = parent ? parent.thickness * 0.75 : random(12, 20);
                this.thickness = constrain(this.thickness, 3, 20);
                
                this.length = 0;
                this.speed = random(1.0, 2.5);
                this.maxLength = random(20, 80);
                this.children = [];
                this.alive = true;
                this.phase = random(TWO_PI);
                this.depth = random(-3, 3);
            }

            getTip() {
                return {x: this.x + cos(this.angle) * this.length, y: this.y + sin(this.angle) * this.length};
            }

            grow() {
                if(!this.alive || this.length >= this.maxLength) return;
                
                let vib = sin(frameCount * 0.03 + this.phase) * 0.04;
                this.angle += vib;
                this.length += this.speed;

                if(this.length > this.maxLength * 0.6 && this.children.length === 0) {
                    if(random() < 0.2 && this.thickness > 4) {
                        let tip = this.getTip();
                        let newAngle1 = this.angle + random(0.6, 1.2);
                        let newAngle2 = this.angle - random(0.8, 1.0);
                        this.children.push(new Branch(tip.x, tip.y, newAngle1, this));
                        this.children.push(new Branch(tip.x, tip.y, newAngle2, this));
                        this.alive = false;
                    }
                }
            }
            
            renderHeightMap(buffer) {
                let tip = this.getTip();
                buffer.noStroke();
                buffer.fill(255, 150);
                
                // ============================================================
                // FORMAS NO CIRCULARES (Manchas elásticas y grumosas)
                // ============================================================
                let radX = this.thickness + random(-0.5, 0.5);
                let radY = this.thickness * random(0.6, 1.4) + random(-0.5, 0.5);
                // Giro el pincel para que no sea perfectamente recto
                buffer.ellipse(tip.x, tip.y, radX, radY);

                if(this.parent) {
                    let pTip = this.parent.getTip();
                    let steps = int(dist(pTip.x, pTip.y, tip.x, tip.y) / 4);
                    for(let i=0; i<steps; i++) {
                        let t = i / steps;
                        let x = lerp(pTip.x, tip.x, t);
                        let y = lerp(pTip.y, tip.y, t);
                        
                        // Aquí deformamos el camino: en lugar de un círculo, dibujamos una mancha alargada
                        // que cambia de forma en cada paso, como una célula estirándose.
                        let cellSize = this.thickness * (1 - t * 0.5) + random(-0.3, 0.3);
                        let stretchX = cellSize * random(0.5, 1.5);
                        let stretchY = cellSize * random(0.5, 1.5);
                        
                        // Rotamos la mancha según la dirección de la rama para que fluya
                        let angleOffset = this.angle + random(-0.1, 0.1);
                        buffer.push();
                        buffer.translate(x, y);
                        buffer.rotate(angleOffset);
                        buffer.ellipse(0, 0, stretchX, stretchY);
                        buffer.pop();
                    }
                }

                // ============================================================
                // BULBOS DEFORMES (Grumos irregulares)
                // ============================================================
                if(this.children.length > 0 && !this.alive) {
                    buffer.fill(255, 180);
                    
                    // En lugar de un círculo, dibujamos un "grumo" hecho de 3 o 4 partes superpuestas
                    let numLumps = floor(random(3, 6));
                    for(let i=0; i<numLumps; i++) {
                        let offsetX = random(-this.thickness, this.thickness);
                        let offsetY = random(-this.thickness, this.thickness);
                        
                        // Cada parte del grumo es una elipse deforme (no un círculo)
                        let lumpRadX = this.thickness * random(0.6, 1.2) + random(0, 3);
                        let lumpRadY = this.thickness * random(0.6, 1.2) + random(0, 3);
                        
                        buffer.ellipse(tip.x + offsetX, tip.y + offsetY, lumpRadX, lumpRadY);
                    }
                }

                for(let child of this.children) {
                    child.renderHeightMap(buffer);
                }
            }
        }

        class MyceliumNetwork {
            constructor(x, y) {
                this.rootX = x; this.rootY = y;
                this.allBranches = [];
                for(let i=0; i<5; i++) {
                    let angle = (TWO_PI / 5) * i + random(-0.3, 0.3);
                    let b = new Branch(x, y, angle);
                    b.thickness = random(15, 25);
                    this.allBranches.push(b);
                }
            }

            update() {
                for(let b of this.allBranches) {
                    b.grow();
                    for(let child of b.children) {
                        if(!this.allBranches.includes(child)) this.allBranches.push(child);
                    }
                }
                
                if(audioStarted && frameCount % 3 === 0) {
                    let b = random(this.allBranches);
                    if(b) {
                        let tip = b.getTip();
                        let freq = map(b.length, 0, b.maxLength, 200, 4000);
                        let amp = map(b.thickness, 3, 20, 0.01, 0.1);
                        playSoundFromBranch(tip.x, tip.y, b.depth, freq, amp);
                    }
                }
            }

            render(buffer) {
                for(let b of this.allBranches) b.renderHeightMap(buffer);
            }
        }

        // ============================================================
        // PARTE 3: PIPELINE DE RELIEVE (Emboss + Color Morado/Blanco)
        // ============================================================
        let network;
        let heightBuffer;
        let finalBuffer;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            initSpatialAudio();
            initVoicePool();
            
            heightBuffer = createGraphics(width, height);
            finalBuffer = createGraphics(width, height);
            network = new MyceliumNetwork(width/2, height/2);

            setTimeout(() => {
                document.getElementById('startHint').style.opacity = '0';
            }, 5000);
            
            setupUI();
        }

        function draw() {
            if(!audioStarted){
                background(80);
                push();
                translate(width/2,height/2);
                let pulse=sin(frameCount*0.04)*8;
                noStroke();
                fill(255,180);
                textAlign(CENTER,CENTER);
                textSize(14);
                text("click to activate sound",0,40+pulse);
                pop();
                frameCount++;
                return;
            }

            updateListenerOrientation(mouseX, mouseY);
            
            network.update();

            heightBuffer.background(0);
            heightBuffer.blendMode(ADD);
            network.render(heightBuffer);
            heightBuffer.blendMode(BLEND);

            finalBuffer.copy(heightBuffer, 0, 0, width, height, 0, 0, width, height);
            finalBuffer.loadPixels();
            heightBuffer.loadPixels();

            for (let x = 1; x < width - 1; x += 1) {
                for (let y = 1; y < height - 1; y += 1) {
                    let index = (x + y * width) * 4;
                    
                    let center = heightBuffer.pixels[index];
                    let right  = heightBuffer.pixels[index + 4];
                    let down   = heightBuffer.pixels[index + width * 4];
                    
                    let diffX = (center - right) * 1.2;
                    let diffY = (center - down) * 1.2;
                    let shadow = (diffX + diffY) * 0.8;
                    shadow = constrain(shadow, -80, 80);

                    // ============================================================
                    // COLORES MORADOS Y BLANCOS (Telesma)
                    // ============================================================
                    // Base es un morado suave (como 160, 140, 180) + la sombra del relieve
                    let baseR = 160 + shadow;
                    let baseG = 130 + shadow;
                    let baseB = 180 + shadow;

                    // Cuanto más altura (centro blanco), más tiramos a blanco
                    let whiteness = center / 255.0;
                    baseR = lerp(baseR, 220, whiteness);
                    baseG = lerp(baseG, 220, whiteness);
                    baseB = lerp(baseB, 230, whiteness);

                    let grain = random(-8, 8);
                    finalBuffer.pixels[index]     = constrain(baseR + grain, 0, 255);
                    finalBuffer.pixels[index + 1] = constrain(baseG + grain, 0, 255);
                    finalBuffer.pixels[index + 2] = constrain(baseB + grain, 0, 255);
                    finalBuffer.pixels[index + 3] = 255;
                }
            }
            finalBuffer.updatePixels();
            image(finalBuffer, 0, 0);
        }

        function mousePressed() {
            if(!audioStarted){
                userStartAudio();
                audioStarted = true;
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                document.getElementById('startHint').style.display = 'none';
            }
            network = new MyceliumNetwork(mouseX, mouseY);
            heightBuffer.background(0);
            finalBuffer.background(160, 130, 180);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            heightBuffer = createGraphics(width, height);
            finalBuffer = createGraphics(width, height);
        }

        function setupUI() {
            const slider = document.getElementById('masterSlider');
            const muteBtn = document.getElementById('muteBtn');
            const closeTelesma = document.getElementById('closeTelesma');
            const telesmaDiv = document.getElementById('telesmaInfo');

            slider.addEventListener('input', e => { masterVolume = parseFloat(e.target.value); });
            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                muteBtn.innerHTML = isMuted ? 'X' : 'M';
                if(isMuted) for(let v of voicePool) v.osc.amp(0, 0.05);
            });
            closeTelesma.addEventListener('click', (e) => {
                e.stopPropagation();
                telesmaDiv.style.opacity = '0';
                telesmaDiv.style.transform = 'translateX(-20px)';
                setTimeout(() => telesmaDiv.style.display = 'none', 300);
            });
            
            document.getElementById('binauralBtn').addEventListener('click', () => {
                document.getElementById('binauralOverlay').classList.add('active');
            });
            document.getElementById('closeBinaural').addEventListener('click', () => {
                document.getElementById('binauralOverlay').classList.remove('active');
            });
            document.getElementById('binauralOverlay').addEventListener('click', (e) => {
                if(e.target === document.getElementById('binauralOverlay')) {
                    document.getElementById('binauralOverlay').classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
